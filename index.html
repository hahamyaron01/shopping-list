html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px 16px 10px;margin:0 -16px}

.sync{font-size:13px;color:var(--muted);white-space:nowrap}

.sync.on .dot{background:var(--done)}

.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.add input:focus{border-color:var(--ink);outline:none}
.add select{padding:0 8px;border:2px solid var(--line);border-radius:12px;background:var(--card);max-width:118px;font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.mark{background:var(--mark);color:var(--markInk)}

.sugg{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap}
.chip.on{background:var(--chipOn);color:var(--chipOnInk)}
.chip .plus{color:var(--muted);margin-inline-start:4px}
.chip.on .plus{color:inherit}

.group{margin-top:22px}

.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.by{display:block;font-size:13px;font-weight:400;color:var(--muted);line-height:1.3}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:36px;height:36px;border-radius:10px;border:0;background:var(--chip);font-size:20px;line-height:1}
.qty span{min-width:28px;text-align:center;font-weight:700}
.del{width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:20px;border-radius:10px}

.progress{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--done);transition:width .3s}
.stat{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
.srow{width:100%;text-align:right;display:flex;align-items:center;gap:14px;padding:14px;border:0;border-top:1px solid var(--line);background:transparent;min-height:64px;font-size:19px}
.srow:first-child{border-top:0}

.sname{flex:1;position:relative}
.sname em{font-style:normal;font-weight:700;background:var(--mark);color:var(--markInk);border-radius:6px;padding:0 6px;margin-inline-start:8px;font-size:15px}
.srow.done{background:var(--doneSoft)}
.srow.done .box{background:var(--done);border-color:var(--done)}
.srow.done .box svg{opacity:1;transform:scale(1)}
.srow.done .sname{color:var(--muted)}
.srow.done .sname::after{content:"";position:absolute;right:0;top:.72em;height:2.5px;width:100%;background:var(--done);border-radius:2px;animation:strike .25s ease-out}

.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{position:relative}
.pchip .x{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:13px;line-height:22px;padding:0}

.empty{text-align:center;padding:48px 16px;color:var(--muted)}

.empty .btn{margin-top:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.note{font-size:14px;color:var(--muted);margin-top:8px}

.lists{display:flex;gap:8px;margin-top:10px}
.lt{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px;font-weight:700;font-size:15px}

.lti:first-child{border-top:0}
.lti input{width:22px;height:22px;accent-color:var(--done);flex:none}
.lti span{flex:1}.lti small{color:var(--muted)}.lti.has{opacity:.55}
.lti em{font-style:normal;font-weight:700;background:var(--mark);color:var(--markInk);border-radius:6px;padding:0 6px;font-size:14px}
.miss{display:block;font-size:12.5px;font-weight:700;color:var(--danger);line-height:1.3}
.annc{width:100%;margin-top:12px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:14px;padding:8px 0 0;text-decoration:underline;text-underline-offset:3px}
textarea.copy{width:100%;min-height:160px;margin-top:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:10px}
</style>

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const target=view==="pool"?"pool":"list";
  let broken=false;try{broken=localStorage.getItem("micBroken")==="1"}catch(_){}
  if(!SR||broken){openBulk("",true,target);return}
  if(S.rec){if(S.recFinish)S.recFinish(false);return}
  const r=new SR();r.lang="he-IL";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  let txt="",audio=false,done=false,wd=null;
  S.rec=r;S.recCancel=false;
  const finish=noAudio=>{
    if(done)return;done=true;clearTimeout(wd);
    const cancel=S.recCancel;S.rec=null;S.recCancel=false;S.recFinish=null;
    try{r.abort()}catch(_){}
    if($("#liveTxt"))hideSheet();
    if(cancel)return;
    if(txt.trim()){voiceDone(txt,target);return}
    if(noAudio){try{localStorage.setItem("micBroken","1")}catch(_){}}
    openBulk("",true,target);
  };
  S.recFinish=finish;
  r.onaudiostart=()=>{audio=true};
  r.onresult=e=>{audio=true;let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;txt=t;showListening(t)};
  r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture")finish(true)};
  r.onend=()=>finish(!audio);
  wd=setTimeout(()=>{if(!audio)finish(true)},5000);
  try{r.start();showListening("")}catch(_){finish(true)}
}

function localSpoken(text){
  const toks=text.trim().split(/\s+/),out=[];let cur=null;
  const push=()=>{if(cur&&cur.w.length)out.push({name:norm(cur.w.join(" ")),qty:cur.q})};
  for(const t of toks){
    let n=NUMW[t]||(/^\d{1,2}$/.test(t)?+t:0);
    if(!n&&t.length>2&&t[0]==="ו"&&NUMW[t.slice(1)])n=NUMW[t.slice(1)];
    if(n){push();cur={q:n,w:[]};continue}
    if(t.length>2&&t[0]==="ו"&&cur&&cur.w.length){push();cur={q:1,w:[t.slice(1)]};continue}
    if(!cur)cur={q:1,w:[]};
    cur.w.push(t);
  }
  push();return out.filter(x=>x.name);
}

function parseBulk(text){
  return String(text).split(/[\n,،;]+/).map(s=>{
    s=s.replace(/^[\s•·\-–*✓✔☐▪]+/,"").replace(/^\d+[.)]\s+/,"").trim();
    let q=1,m;
    {const w=s.split(/\s+/);if(w.length>1&&NUMW[w[0]]){q=NUMW[w[0]];s=w.slice(1).join(" ")}}
    if(q>1){}else
    if((m=s.match(/^(\d{1,2})\s*[x×*]?\s+(.+)$/))){q=+m[1];s=m[2]}
    else if((m=s.match(/^(.+?)\s*[x×*]\s*(\d{1,2})$/))){s=m[1];q=+m[2]}
    else if((m=s.match(/^(.+?)\s+(\d{1,2})$/))&&+m[2]<=20){s=m[1];q=+m[2]}
    return {name:norm(s),qty:Math.max(1,Math.min(q,99))};
  }).filter(x=>x.name);
}

  $("#sheet").innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="הוספה מרובה"><h3>${S.bulkTarget==="pool"?"הוספה לקבועים":"הוספה לרשימה"}</h3>
    ${voiceFail?`<p class="note"><b>🎤 הקש על המיקרופון שבמקלדת</b> ותגיד את המוצרים, למשל ״חלב שתי פיתות וקוטג׳״. אחר כך לחץ הוספה ואני אפרק למוצרים. <button class="linkbtn" id="micRetry" type="button">לנסות שוב את מיקרופון הדף</button></p>`:""}${prefill?`<p class="note"><b>🎤 זה מה ששמעתי.</b> מוצר בכל שורה, אפשר לתקן ואז ללחוץ הוספה.</p>`:""}
    <p class="note">מוצר בכל שורה או מופרדים בפסיק. אפשר להדביק הודעה מוואטסאפ.${S.bulkTarget==="list"?" כמות: ״2 לחם״ או ״לחם x2״.":""}</p>
    <textarea class="copy" id="bulkText" placeholder="הקש כאן כדי לכתוב או להכתיב…"></textarea>
    <select id="bulkCat" aria-label="מחלקה">${catOptions()}</select>
    <div class="bar"><button class="btn" id="bulkGo">הוספה</button><button class="btn ghost" id="sheetClose">ביטול</button></div></div>`;
  $("#sheet").classList.remove("hidden");
  setTimeout(()=>{const ta=$("#bulkText");if(ta){if(prefill)ta.value=prefill;ta.focus()}},50);
}
function closeSheet(){if(S.rec){S.recCancel=true;const f=S.recFinish;try{S.rec.abort()}catch(_){};if(f)f(false)}hideSheet()}
function hideSheet(){$("#sheet").classList.add("hidden");$("#sheet").innerHTML=""}
function setCat(pid,cat){
  const p=S.pool[pid];if(!p){closeSheet();return}
  if(p.cat!==cat){
    api.set("pool",pid,{...p,cat});
    Object.entries(S.items).filter(([,v])=>v.name===p.name&&v.cat!==cat).forEach(([id,v])=>api.set("items",id,{...v,cat}));
  }
  closeSheet();render();showToast(`${p.name} עבר ל${cat}`);
}
document.addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
let view=(location.hash||"").slice(1);
if(!["list","pool","shop"].includes(view)) view="list";
let poolEdit=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const check='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

function grouped(list){
  const g={};list.forEach(([id,v])=>{const c=CATS.includes(v.cat)?v.cat:"אחר";(g[c]=g[c]||[]).push([id,v])});
  return CATS.filter(c=>g[c]).map(c=>[c,g[c].sort((a,b)=>a[1].name.localeCompare(b[1].name,"he"))]);
}
function catOptions(){return `<option value="">מחלקה: אוטומטי</option>`+CATS.map(c=>`<option>${esc(c)}</option>`).join("")}

function render(){
  renderLists();
  renderLive();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const open=Object.values(S.items).filter(v=>!v.done).length;
  const b=$("#bList");b.textContent=open;b.classList.toggle("hidden",!open);
  const sync=$("#sync");
  if(S.mode==="db"){
    if(S.readOnly){sync.className="sync";sync.innerHTML='<span class="dot"></span>צפייה בלבד'}
    else{sync.className="sync on";sync.innerHTML='<span class="dot"></span>מסונכרן עם המשפחה'}
  }
  else if(S.mode==="local"){sync.className="sync";sync.innerHTML='<span class="dot"></span>נשמר במכשיר הזה'}
  if(S.mode==="loading"){$("#main").innerHTML='<div class="empty">טוען את הרשימה…</div>';$("#headExtra").innerHTML="";return}
  ({list:renderList,pool:renderPool,shop:renderShop})[view]();
}

function addBar(placeholder){
  return `<form class="add" id="addForm" autocomplete="off">
    <input id="addInput" placeholder="${placeholder}" enterkeyhint="done" aria-label="שם מוצר">
    <select id="addCat" aria-label="מחלקה">${catOptions()}</select>
    <button class="btn" type="submit">הוספה</button></form>
    <div class="tools"><button class="tool" id="micBtn" type="button">🎤 הקראה</button><button class="tool" id="bulkOpen" type="button">📋 כמה מוצרים</button></div>`;
}
function bindAdd(fn){
  const f=$("#addForm");if(!f)return;
  f.onsubmit=e=>{e.preventDefault();const i=$("#addInput");if(!norm(i.value))return;fn(i.value,$("#addCat").value);i.value="";$("#addCat").value="";i.focus()};
}

function renderList(){
  $("#title").textContent="הרשימה";
  const items=Object.entries(S.items).filter(([,v])=>!v.done);
  const inList=new Set(items.map(([,v])=>v.name));
  const sugg=Object.entries(S.pool).filter(([,v])=>!inList.has(v.name)).sort((a,b)=>(b[1].uses||0)-(a[1].uses||0)).slice(0,12);
  $("#headExtra").innerHTML=addBar("מה לקנות? אפשר כמה, עם פסיק")+
    (sugg.length?`<div class="sugg">${sugg.map(([id,v])=>`<button class="chip" data-pool="${id}">${esc(v.name)}<span class="plus">+</span></button>`).join("")}</div>`:"");
  bindAdd((n,c)=>addMany(n,c,"list"));
  const doneCount=Object.values(S.items).filter(v=>v.done).length;
  if(!items.length){
    $("#main").innerHTML=`<div class="empty"><b>הרשימה ריקה</b>${Object.keys(S.pool).length?"הקלד מוצר למעלה או הקש על אחד מהקבועים":"הקלד מוצר למעלה, או התחל ממאגר מוצרים בסיסי"}
      ${Object.keys(S.pool).length?`<br><button class="btn ghost" data-go="pool">פתיחת הקבועים</button>`:`<br><button class="btn mark" id="starter">טעינת מאגר בסיסי</button>`}</div>`+
      (doneCount?`<div class="bar"><button class="btn ghost" id="clearDone">ניקוי ${doneCount} שנקנו</button></div>`:"");
  } else {
    $("#main").innerHTML=grouped(items).map(([c,list])=>`<section class="group"><h2><span>${esc(c)}</span><span>${list.length}</span></h2><div class="rows">`+
      list.map(([id,v])=>`<div class="row${S.fresh.has(id)?" fresh":""}"><span class="name">${esc(v.name)}${missHtml(v)}${byHtml(v)}</span>
        <span class="qty"><button data-q="${id}" data-d="-1" aria-label="פחות">−</button><span>${v.qty||1}</span><button data-q="${id}" data-d="1" aria-label="עוד">+</button></span>
        <button class="del" data-del="${id}" aria-label="הסרת ${esc(v.name)}">✕</button></div>`).join("")+`</div></section>`).join("")+
      `<div class="bar"><button class="btn mark" data-go="shop">🛒 יוצא לסופר</button><button class="btn ghost" id="share">העתקה כטקסט</button><button class="btn ghost" id="clearAll">ניקוי הרשימה</button>${doneCount?`<button class="btn ghost" id="clearDone">ניקוי ${doneCount} שנקנו</button>`:""}</div><div id="copyBox"></div>`;
  }
  $("#main").insertAdjacentHTML("beforeend",lastTripBar()+famBar());
}

function renderPool(){
  $("#title").textContent="קבועים";
  $("#headExtra").innerHTML=addBar("הוספת מוצר קבוע");
  bindAdd((n,c)=>addMany(n,c,"pool"));
  const pool=Object.entries(S.pool);
  if(!pool.length){$("#main").innerHTML=`<div class="empty"><b>אין עדיין מוצרים קבועים</b>כל מוצר שתוסיף לרשימה יישמר כאן אוטומטית.<br><button class="btn mark" id="starter">טעינת מאגר בסיסי</button></div>`;return}
  const active=new Set(Object.values(S.items).filter(v=>!v.done).map(v=>v.name));
  const n=pool.filter(([,v])=>active.has(v.name)).length;
  $("#main").innerHTML=(poolEdit?`<p class="note"><b>מצב עריכה:</b> הקשה על מוצר משנה את המחלקה שלו, ✕ מוחק אותו מהקבועים.</p>`:`<p class="note">הקשה מוסיפה לרשימה, הקשה נוספת מורידה. ${n?`<b>${n} ברשימה כרגע.</b>`:""}</p>`)+
    grouped(pool).map(([c,list])=>`<section class="group"><h2>${esc(c)}</h2><div class="pchips">`+
      list.sort((a,b)=>(b[1].uses||0)-(a[1].uses||0)).map(([id,v])=>`<span class="pchip"><button class="chip ${active.has(v.name)?"on":""}" data-pool="${id}" aria-pressed="${active.has(v.name)}">${active.has(v.name)?"✓ ":""}${esc(v.name)}</button>${poolEdit?`<button class="x" data-prm="${id}" aria-label="מחיקת ${esc(v.name)}">✕</button>`:""}</span>`).join("")+
    `</div></section>`).join("")+
    `<div class="bar"><button class="btn ghost" id="poolEdit">${poolEdit?"סיום עריכה":"✏️ עריכה ושינוי מחלקות"}</button></div>`;
}

function renderShop(){
  $("#title").textContent=curL().in;
  const all=Object.entries(S.items);
  const done=all.filter(([,v])=>v.done).length, total=all.length;
  const ann=S.mode==="db"?`<button class="btn mark annc" id="announce">📣 עדכון המשפחה שאני ${curL().in}</button>`:"";
  $("#headExtra").innerHTML=ann+(total?`<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${total?done/total*100:0}%"></i></div>
    <div class="stat"><span>${done} מתוך ${total} בעגלה</span><span>${total-done?`נשארו ${total-done}`:"הכול בעגלה 🎉"}</span></div>`:"");
  if(!total){$("#main").innerHTML=`<div class="empty"><b>אין מה לקנות</b>הוסף מוצרים לרשימה לפני היציאה לסופר.<br><button class="btn" data-go="list">לרשימה</button></div>`;return}
  const todo=all.filter(([,v])=>!v.done), got=all.filter(([,v])=>v.done).sort((a,b)=>(b[1].doneTs||0)-(a[1].doneTs||0));
  const row=([id,v])=>`<button class="srow ${v.done?"done":""}${S.fresh.has(id)?" fresh":""}" data-t="${id}" aria-pressed="${!!v.done}"><span class="box">${check}</span><span class="sname">${esc(v.name)}${(v.qty||1)>1?`<em>×${v.qty}</em>`:""}${missHtml(v)}${byHtml(v)}</span></button>`;
  $("#main").innerHTML=grouped(todo).map(([c,list])=>`<section class="group"><h2><span>${esc(c)}</span><span>${list.length}</span></h2><div class="rows">${list.map(row).join("")}</div></section>`).join("")+
    (got.length?`<section class="group"><h2><span>בעגלה</span><span>${got.length}</span></h2><div class="rows">${got.map(row).join("")}</div></section>`:"")+
    `<div class="bar">${got.length?`<button class="btn" id="finish">סיימתי, ניקוי ${got.length} שנקנו</button>`:""}</div>`;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.closest("nav")&&t.dataset.v){go(t.dataset.v);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.setcat){setCat(t.dataset.pid,t.dataset.setcat);return}
  if(t.id==="micBtn"){startVoice();return}
  if(t.id==="micStop"){micStop();return}
  if(t.id==="micRetry"){try{localStorage.removeItem("micBroken")}catch(_){};hideSheet();startVoice();return}
  if(t.id==="bulkOpen"){openBulk();return}
  if(t.id==="bulkGo"){const tx=$("#bulkText").value,c=$("#bulkCat").value,tg=S.bulkTarget;closeSheet();smartAdd(tx,c,tg);return}
  if(t.id==="sheetClose"){closeSheet();return}
  if(t.id==="nameSave"){saveName();return}
  if(t.id==="invite"){invite();return}
  if(t.id==="announce"){announce();return}
  if(t.dataset.list){setList(t.dataset.list);return}
  if(t.id==="lastTrip"){openLastTrip();return}
  if(t.id==="ltGo"){ltAdd();return}
  if(t.id==="keepLeft"){keepLeft();return}
  if(t.dataset.moveto){moveLeft(t.dataset.moveto);return}
  if(t.id==="ltToggle"){const bs=[...document.querySelectorAll('#sheet input[data-li]:not(:disabled)')];const on=bs.some(b=>!b.checked);bs.forEach(b=>b.checked=on);return}
  if(t.id==="changeName"){askName();return}
  if(t.dataset.pool){(poolEdit&&view==="pool")?openCat(t.dataset.pool):poolTap(t.dataset.pool);return}
  if(t.dataset.prm){poolRemove(t.dataset.prm);return}
  if(t.dataset.q){const v=S.items[t.dataset.q];setQty(t.dataset.q,(v.qty||1)+ +t.dataset.d);return}
  if(t.dataset.del){removeItem(t.dataset.del);return}
  if(t.dataset.t){toggleDone(t.dataset.t);if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){};return}
  if(t.id==="starter")loadStarter();
  if(t.id==="poolEdit"){poolEdit=!poolEdit;render()}
  if(t.id==="clearDone")clearDone();
  if(t.id==="finish")finishTrip();
  if(t.id==="clearAll")clearAll();
  if(t.id==="share")share();
});
function go(v){view=v;poolEdit=false;try{history.replaceState(null,"","#"+v)}catch(_){location.hash=v}render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["list","pool","shop"].includes(v)&&v!==view){view=v;render()}});

async function share(){
  const items=Object.values(S.items).filter(v=>!v.done);
  const txt="🛒 רשימת קניות\n"+grouped(items.map(v=>[0,v])).map(([c,l])=>`\n${c}:\n`+l.map(([,v])=>`• ${v.name}${(v.qty||1)>1?` ×${v.qty}`:""}`).join("\n")).join("\n");
  try{await navigator.clipboard.writeText(txt);showToast("הרשימה הועתקה, אפשר להדביק בווטסאפ")}
  catch(_){$("#copyBox").innerHTML=`<textarea class="copy" readonly>${esc(txt)}</textarea>`;const ta=$("#copyBox textarea");ta.focus();ta.select()}
}

let tt;
function showToast(msg,undo){
  const t=$("#toast");$("#toastMsg").textContent=msg;
  const u=$("#toastUndo");u.classList.toggle("hidden",!undo);u.onclick=()=>{undo&&undo();t.classList.add("hidden")};
  t.classList.remove("hidden");clearTimeout(tt);tt=setTimeout(()=>t.classList.add("hidden"),4500);
}

function getFamilyId(){
  const u=new URL(location.href);let f=u.searchParams.get("f");
  if(!(f&&/^[a-z0-9]{8,40}$/i.test(f))){f=null;try{f=localStorage.getItem("famId")}catch(_){}}
  if(!f){const a="abcdefghijklmnopqrstuvwxyz0123456789";f=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>a[b%36]).join("")}
  try{localStorage.setItem("famId",f)}catch(_){}
  if(u.searchParams.get("f")!==f){u.searchParams.set("f",f);try{history.replaceState(null,"",u.toString())}catch(_){}}
  return f;
}
try{const c=localStorage.getItem("curList");if(LISTS.some(l=>l.id===c))S.list=c}catch(_){}
render();
(async()=>{
  const offline=msg=>{S.mode="local";loadLocal();render();migrateCats();if(msg)showToast(msg)};
  if(!window.firebase){offline("אין חיבור לשרת, עובד מהמכשיר");return}
  try{S.myName=localStorage.getItem("myName")||""}catch(_){}
  const fid=getFamilyId();
  let db;
  try{
    firebase.initializeApp(FB_CONFIG);
    db=firebase.firestore();
    try{await withTimeout(db.enablePersistence({synchronizeTabs:true}),4000)}catch(_){}
    const auth=firebase.auth();
    let user=await withTimeout(new Promise(res=>{const un=auth.onAuthStateChanged(u=>{un();res(u)})}),8000);
    if(!user){const c=await withTimeout(auth.signInAnonymously(),10000);user=c&&c.user}
    if(!user)throw new Error("auth");
    S.me=user.uid;
  }catch(e){offline("הסנכרון לא זמין, עובד מהמכשיר");return}
  S.db=db;S.fid=fid;S.fam=db.collection("families").doc(fid);S.mode="db";S.lastShop=null;
  let got={items:false,pool:false};
  const timer=setTimeout(()=>{if(!got.items||!got.pool){$("#sync").className="sync";$("#sync").innerHTML='<span class="dot"></span>אין חיבור, ייתכן שהרשימה לא עדכנית';got.items=got.pool=true;render()}},10000);
  ["items","pool"].forEach(col=>{
    S.fam.collection(col).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});
      if(col==="items"&&got.items&&S.loadedAt&&Date.now()-S.loadedAt>3000){try{notifyNew(snap.docChanges().filter(c=>c.type==="added"&&!S.mine.has(c.doc.id)&&!c.doc.metadata.hasPendingWrites).map(c=>[c.doc.id,c.doc.data()]))}catch(_){}}
      S.raw[col]=m;applyList();got[col]=true;
      if(got.items&&got.pool){clearTimeout(timer);if(!S.loadedAt)S.loadedAt=Date.now();render();migrateCats()}
    },err=>{clearTimeout(timer);offline(err&&err.code==="permission-denied"?"אין הרשאה לרשימה, בדוק את כללי Firebase":"הסנכרון לא זמין, עובד מהמכשיר")});
  });
  S.fam.collection("meta").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.meta=m;if(S.loadedAt)render()},()=>{});
  S.fam.collection("presence").onSnapshot(snap=>{S.presence=snap.docs.map(d=>({id:d.id,...d.data()}));computeShoppers();renderLive()},()=>{});
  setInterval(()=>{if(S.lastShop&&!document.hidden)writePresence(true);computeShoppers();renderLive()},45000);
  if(!S.myName)setTimeout(askName,900);
})();
</script>
</body>
